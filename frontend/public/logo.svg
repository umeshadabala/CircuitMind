<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- CircuitMind Studio Logo Mark -->
  <defs>
    <linearGradient id="cmGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8c37"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="traceGrad" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Hex/Squircle Tile with subtle border -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#141419" stroke="#2a2a36" stroke-width="1.5"/>

  <!-- Circuit Traces -->
  <!-- Top trace with terminal pad -->
  <path d="M12 12 H22 L26 16 H36" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="12" r="2.5" fill="#f97316" stroke="#141419" stroke-width="1"/>
  
  <!-- Central Microcontroller / Chip Core -->
  <rect x="17" y="17" width="14" height="14" rx="3.5" fill="#1c1c24" stroke="url(#cmGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Chip Core Pin Leads -->
  <line x1="13" y1="20" x2="17" y2="20" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="13" y1="28" x2="17" y2="28" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="31" y1="20" x2="35" y2="20" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="31" y1="28" x2="35" y2="28" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  
  <line x1="20" y1="13" x2="20" y2="17" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28" y1="13" x2="28" y2="17" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="31" x2="20" y2="35" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28" y1="31" x2="28" y2="35" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Chip Internal Node / Signal Center -->
  <circle cx="24" cy="24" r="3" fill="url(#cmGrad)"/>

  <!-- Bottom-left to bottom-right diagnostic trace with node -->
  <path d="M12 36 H18 L22 32" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="36" r="2.5" fill="#38bdf8" stroke="#141419" stroke-width="1"/>

  <path d="M26 32 L30 36 H36" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="36" r="2.5" fill="#10b981" stroke="#141419" stroke-width="1"/>
  <circle cx="36" cy="16" r="2.5" fill="#f97316" stroke="#141419" stroke-width="1"/>
</svg>
